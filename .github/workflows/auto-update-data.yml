name: Update Course Data

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (08:00 and 20:00 UTC+8)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  update-data:
    name: Update Course Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fetch latest course data
        run: npm run update-data

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/all.json
          git diff --staged --quiet || (git commit -m "chore: auto-update course data" && git push)
